name: Refresh employer job feeds
on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/refresh_jobs.py
      # Enrichment failure must not block publishing the refreshed feeds.
      - name: Enrich new or changed jobs
        continue-on-error: true
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: python scripts/enrich_jobs.py
      - run: python scripts/snapshot_history.py
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/jobs.json web/data/source-health.json web/data/job-enrichment.json web/data/history
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified employer job feeds'
            git push
          fi
