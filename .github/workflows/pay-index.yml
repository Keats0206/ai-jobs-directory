name: Publish micro1 Pay Index
# One frozen edition per month, after the 1st's daily refresh (07:20 UTC) has landed.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-data-refresh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/pay_index.py
      - name: Commit new edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/pay-index web/public/pay-index
          if ! git diff --cached --quiet; then
            git commit -m "Publish micro1 Pay Index $(date -u +%Y-%m)"
            git push
          fi
